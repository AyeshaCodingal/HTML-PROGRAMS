<html>
    <head>
        <title>my zoo</title>
        <style>
body{
    font-family: cursive;
    background-color: aliceblue;
    text-align: center;
    padding: 30px;
}

h1{
    color: chocolate;
}

#zoo{
    border:2px  solid orangered;
    width: 300px;
    margin: 16px auto;
    padding: 12px;
    border-radius: 10px;
    background-color: white;
}
.zone{

    border: 1px solid orangered;
    margin: 6px 0;
    border-radius: 6px;
    padding: 8px 12px;
    text-align: left;
}
button{ 
    background-color: orange;
    color: white;
    font-family: cursive;
    padding: 10px 24px;
    border-radius: 20px;
    border: none;
    text-align: center;
    cursor: pointer;

}
        </style>

    </head>
    <body>
         <h1>My Zoo!</h1>
         <p>Use Javascript to fill the zoo panels with animals.</p>
         <div id="zoo"> 
            <div class="zone1">zone 1 : <span id="zone1"></span></div>
            <div class="zone2">zone 2 : <span id="zone2"></span></div>
            <div class="zone3">zone 3 : <span id="zone3"></span></div>
            <div class="zone">total animals : <span id="total"></span></div>
            <br>
            <button onclick="openzoo()">open zoo</button>
            <p id="zoo-status"></p>


            <script>
                function openzoo(){
              document.getElementById("zone1").innerHTML= "Lion";
              document.getElementById("zone2").innerHTML= "elephant";
              document.getElementById("zone3").innerHTML= "Zebra";

              document.getElementById("total").innerHTML= "3";

              document.getElementById("zoo").style.backgroundColor="lightgreen";

              document.getElementById("zoo-status").innerHTML= document.title+" is open!"

                }
                

            </script>
    </body>

</html>
