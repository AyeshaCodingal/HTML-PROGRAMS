<html>
    <body>
        <p id="join" ></p>
        <p id="array" ></p>
        <p id="popelement" ></p>
        <script>
            var fruits = [ "Apple", "Bannana", "Orange", "strawberry", "Mango"]
            document.getElementById("join").innerHTML=fruits.join("*")
            document.getElementById("array").innerHTML=fruits; 
            fruits.pop();
            document.getElementById("popelement").innerHTML=fruits;
        </script>
    </body>
</html>
